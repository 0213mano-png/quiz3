name: Apply quiz fixes

on:
  push:
    paths:
      - '.github/workflows/apply-quiz-fixes.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch quiz logic and numeric option display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Single-choice numeric questions should preserve separators between values.
          marker = "\nlet currentIndex=0;"
          if 'function cleanSingleOptionText' not in s:
              helper = "\n".join([
                  "",
                  "function cleanSingleOptionText(s){",
                  "  return String(s||'')",
                  "    .replace(/\\r?\\n\\s*/g,' ')",
                  "    .replace(/[ \\t]{2,}/g,' ')",
                  "    .trim();",
                  "}",
                  "",
              ])
              if marker not in s:
                  raise SystemExit('Could not find insertion point for cleanSingleOptionText')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              "span.innerHTML='<strong>'+(idx+1)+'.</strong> '+esc(cleanOptionText(text));",
              "span.innerHTML='<strong>'+(idx+1)+'.</strong> '+esc(cleanSingleOptionText(text));"
          )
          s = s.replace(
              "span.innerHTML=enabled?esc(cleanOptionText(q.options[idx]||'')):'<strong>'+(idx+1)+'.</strong> '+esc(cleanOptionText(q.options[idx]||''));",
              "span.innerHTML=enabled?esc(cleanSingleOptionText(q.options[idx]||'')):'<strong>'+(idx+1)+'.</strong> '+esc(cleanSingleOptionText(q.options[idx]||''));"
          )

          # Two-choice questions are correct only when both selected answers exactly match.
          start = s.find('function gradeStatements(q,card,form,index){')
          end = s.find('\nfunction gradeSingle(q,card,form,index){', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate gradeStatements')

          new_grade = "\n".join([
              "function gradeStatements(q,card,form,index){",
              "  clearFeedback(card,form);",
              "  const checked=[].slice.call(form.querySelectorAll('input[type=\\\"checkbox\\\"]:checked'));",
              "  if(checked.length!==q.required){",
              "    showMessage(card,'⚠️ '+q.required+'つ選択してから採点してください。');",
              "    return false;",
              "  }",
              "",
              "  const selected=checked.map(function(x){return x.value;});",
              "  const correct=(q.correct_labels||[]).slice();",
              "",
              "  // 必要数・正答数・選択内容がすべて一致したときだけ正解。",
              "  // 1つだけ正しい場合などの部分正解は認めない。",
              "  const exact=",
              "    selected.length===q.required &&",
              "    correct.length===q.required &&",
              "    selected.every(function(x){return correct.includes(x);}) &&",
              "    correct.every(function(x){return selected.includes(x);});",
              "",
              "  form.querySelectorAll('.opt').forEach(function(opt){",
              "    const letter=opt.dataset.letter;",
              "    const input=opt.querySelector('input');",
              "",
              "    if(exact){",
              "      if(input.checked) opt.classList.add('correct','sel');",
              "    }else{",
              "      if(input.checked) opt.classList.add('incorrect','sel');",
              "      if(!input.checked && correct.includes(letter)) opt.classList.add('correct-answer');",
              "    }",
              "  });",
              "",
              "  showMessage(card,exact?'✅ 正解！':'❌ 不正解');",
              "  addExplanation(card,q,'<strong>正解：</strong> '+correct.join('、'));",
              "  state[index].graded=true;",
              "  state[index].correct=exact;",
              "  updateUI();",
              "  return true;",
              "}",
              "",
          ])
          s = s[:start] + new_grade + s[end:]

          # Verified current values from MHLW materials.
          verified = [
              '［診断料］170 点 ［撮影料］136 点',
              'ア：1,720     イ：1,700   ウ：1,330     エ：900',
              'ア：1,390 イ：1,390 ウ：1,700 エ：3,000 オ：2,630 カ：3,000 キ：2,660 ク:1,820 コ:3,800',
          ]
          missing = [x for x in verified if x not in s]
          if missing:
              raise SystemExit('Verified numeric answer text missing: ' + repr(missing))

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix multi-answer grading and numeric option display"
          git push
