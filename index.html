<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主任技師等任用候補者選考 模擬試験</title>
<style>

:root{
  --bg:#f4f6fa;--card:#fff;--border:#e3e7ef;--text:#111827;--muted:#64748b;
  --ok:#15803d;--okbg:#f0fdf4;--ng:#dc2626;--ngbg:#fff1f2;--accent:#3730a3;--accent2:#4f46e5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.65;margin:0;background:var(--bg);color:var(--text);
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(100%,900px);margin:0 auto;padding-left:16px;padding-right:16px}

.topbar{
  background:rgba(255,255,255,.96);position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--border);backdrop-filter:blur(10px);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}
.brand h1{font-size:17px;line-height:1.3;margin:0;font-weight:800}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.icon-button,.ghost-button{
  border:1px solid var(--border);background:#fff;color:#1f2937;border-radius:12px;
  min-height:42px;padding:8px 12px;font-weight:700;cursor:pointer
}
.progress-wrap{padding-bottom:8px}
.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;margin-bottom:6px}
.progress-row span:last-child{color:var(--muted);font-weight:600}
.progress-track{height:7px;background:#e9edf5;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:2%;background:var(--accent2);border-radius:999px;transition:width .2s ease}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:2px;padding-bottom:10px}
.shuffle-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.shuffle-toggle input{width:19px;height:19px;cursor:pointer}

#app{padding-top:12px;padding-bottom:18px}
.card{
  display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px 16px;box-shadow:0 4px 18px rgba(15,23,42,.05);margin:0
}
.card.active{display:block}
.question-chip{
  display:inline-flex;align-items:center;border-radius:999px;background:#eef2ff;color:#3730a3;
  padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:10px
}
.title{font-weight:750;font-size:16px;line-height:1.75;margin-bottom:16px;white-space:pre-wrap}
.question-options{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:14px 14px;border:1.5px solid var(--border);
  border-radius:14px;background:#fff;cursor:pointer;min-height:54px;transition:.12s ease;
  -webkit-tap-highlight-color:transparent
}
.opt:active{transform:scale(.995)}
.opt input{margin:4px 0 0;width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent2)}
.opt>div{white-space:pre-wrap;font-size:15px;line-height:1.65;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:#818cf8;background:#f5f7ff;box-shadow:0 0 0 1px rgba(99,102,241,.08)}
.opt.correct.sel{border-color:#22c55e;background:var(--okbg)}
.opt.incorrect.sel{border-color:#ef4444;background:var(--ngbg)}
.opt.correct-answer{border-color:#86efac;background:#f7fff9}

.question-reset-row{display:flex;justify-content:flex-end;margin-top:12px}
.question-reset{
  border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:13px;font-weight:700;cursor:pointer
}
.score{
  font-weight:850;font-size:17px;margin-top:16px;padding:12px 14px;border-radius:12px;background:#f8fafc
}
.explain-details{margin-top:10px;border:1px solid var(--border);border-radius:14px;background:#f8fafc;overflow:hidden}
.explain-details summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:800;font-size:14px}
.explain-details summary::-webkit-details-marker{display:none}
.explain-details summary::after{content:"＋";float:right;color:var(--muted);font-size:18px;line-height:1}
.explain-details[open] summary::after{content:"−"}
.explain{font-size:14px;color:#334155;padding:0 14px 14px;overflow-wrap:anywhere}
.answerline{margin:0 0 8px;font-size:15px}
.diffblock{margin:10px 0;padding-top:9px;border-top:1px dashed #cbd5e1}
.difflabel{font-weight:800;margin-bottom:4px}
.correctline{margin-top:6px;color:#1f2937}
.ins{color:#dc2626;font-weight:800}
del{color:#64748b;text-decoration-color:#ef4444;text-decoration-thickness:2px}
.footer{color:#6b7280;font-size:12px;margin:16px 2px 0}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.98);border-top:1px solid var(--border);
  padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
  box-shadow:0 -5px 20px rgba(15,23,42,.07)
}
.bottom-nav-inner{width:min(100%,900px);margin:0 auto;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px}
.nav-btn{
  min-height:48px;border-radius:13px;border:1px solid var(--border);font-weight:800;cursor:pointer;
  background:#fff;color:#1f2937
}
.nav-btn.primary{background:#111827;color:#fff;border-color:#111827}
.nav-btn:disabled{opacity:.38;cursor:default}

.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.46);display:none;align-items:flex-end;
}
.overlay.open{display:flex}
.sheet{
  width:100%;max-height:82vh;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;box-shadow:0 -12px 34px rgba(15,23,42,.18)
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-16px;background:#fff;padding:8px 0 12px;z-index:2}
.sheet-head h2{font-size:17px;margin:0}
.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.qjump{
  aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:#fff;color:#1f2937;
  font-weight:800;cursor:pointer;position:relative
}
.qjump.answered{background:#eef2ff;border-color:#c7d2fe}
.qjump.correct{background:#ecfdf3;border-color:#86efac;color:#166534}
.qjump.wrong{background:#fff1f2;border-color:#fda4af;color:#9f1239}
.qjump.current{outline:2px solid var(--accent2);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:12px 0}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--border);background:#fff}
.dot.answered{background:#eef2ff;border-color:#c7d2fe}.dot.correct{background:#ecfdf3;border-color:#86efac}.dot.wrong{background:#fff1f2;border-color:#fda4af}

@media(min-width:700px){
  body{padding-bottom:92px}
  .brand h1{font-size:20px}
  .card{padding:26px 28px}
  .title{font-size:18px}
  .opt>div{font-size:16px}
  .question-grid{grid-template-columns:repeat(10,1fr)}
  .sheet{width:min(760px,calc(100% - 40px));margin:0 auto 20px;border-radius:22px;max-height:75vh}
  .overlay{align-items:center}
}

</style>
</head>

<body>
<header class="topbar">
  <div class="wrap header-row">
    <div class="brand">
      <h1>主任技師等任用候補者選考</h1>
      <div class="sub">模擬試験</div>
    </div>
    <button type="button" class="icon-button" id="questionListBtn">問題一覧</button>
  </div>
  <div class="wrap progress-wrap">
    <div class="progress-row"><span id="progressText">問 1 / 50</span><span id="answeredText">回答 0 / 50</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="wrap toolbar">
    <label class="shuffle-toggle"><input type="checkbox" id="globalShuffle"> 選択肢をシャッフル</label>
    <button type="button" class="ghost-button" id="resetAllBtn">全てリセット</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button type="button" class="nav-btn" id="prevBtn">← 前へ</button>
    <button type="button" class="nav-btn primary" id="gradeBtn">採点</button>
    <button type="button" class="nav-btn" id="nextBtn">次へ →</button>
  </div>
</div>

<div class="overlay" id="questionOverlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="questionSheetTitle">
    <div class="sheet-head">
      <h2 id="questionSheetTitle">問題一覧</h2>
      <button type="button" class="icon-button" id="closeQuestionListBtn">閉じる</button>
    </div>
    <div class="legend">
      <span><i class="dot"></i>未回答</span>
      <span><i class="dot answered"></i>回答済み</span>
      <span><i class="dot correct"></i>正解</span>
      <span><i class="dot wrong"></i>不正解</span>
    </div>
    <div class="question-grid" id="questionGrid"></div>
  </div>
</div>

<script>

。","後期高齢者医療制度による医療の対象者は、７５歳以上の者及び６5 歳以上７５歳未満で後 期高齢者医療広域連合（以下「広域連合」）により一定の障害状態にあると認定された者であ る。"]],"red":["イ","国民健康保険","国民健康保険組合","ウ","６5 歳以上","２ イ、ウ"],"explanation_html":"<div class=\"answerline\"><strong>誤っている項目：</strong>イ、ウ</div><div class=\"diffblock\"><div class=\"difflabel\">イ</div><div class=\"diffline\">国民健康保険法は、自営業者、農業専業者等の被用者保険に加入していない者を主たる対象 として成立した地域保険としての国民健康保険<del>組合</del>と同種の事業、業務に従事する者で組織<del> </del>された<span class=\"ins\"> </span>国民健康保険<span class=\"ins\">組合</span>に分かれる。</div><div class=\"correctline\"><strong>正しい文：</strong> 国民健康保険法は、自営業者、農業専業者等の被用者保険に加入していない者を主たる対象 として成立した地域保険としての国民健康保険と同種の事業、業務に従事する者で組織された 国民健康保険組合に分かれる。</div></div><div class=\"diffblock\"><div class=\"difflabel\">ウ</div><div class=\"diffline\">後期高齢者医療制度による医療の対象者は、７５歳以上の者及び６<del>0</del><span class=\"ins\">5</span> 歳以上７５歳未満で後 期高齢者医療広域連合（以下「広域連合」）により一定の障害状態にあると認定された者であ る。</div><div class=\"correctline\"><strong>正しい文：</strong> 後期高齢者医療制度による医療の対象者は、７５歳以上の者及び６5 歳以上７５歳未満で後 期高齢者医療広域連合（以下「広域連合」）により一定の障害状態にあると認定された者であ る。</div></div>","mode":"statements","option_labels":["ア","イ","ウ","エ","オ"],"correct_labels":["イ","ウ"],"required":2},{"id":29,"body":"第 29 問 次の中から誤っている文章を2つ選びなさい。","options":["ア 「労働者災害補償保険法」は、業務上の事由又は通勤による労働者の負傷、疾病、障害、死亡\n   に対し、必要な保険給付を行う。なお、国家公務員の公務上の災害に対する補償について\n   は、これとは別に国家公務員災害補償法がある。","イ   「原子爆弾被爆者に対する援護に関する法律」は、広島市および長崎市で原爆被爆を受け、\n    都道府県知事から被爆者健康手帳の交付を受けた者に対し、公費負担で健康診断や指定医療\n    機関による必要な医療の給付を行うことを定めている。","ウ   「戦傷病者特別援護法」は、軍人・軍属であった者が公務に起因する傷病により、厚生労働\n    大臣から 戦傷病者手帳の交付を受け、さらに都道府県知事から療養券の交付を受けて指定医\n    療機関に提出した場合、療養の給付または更生医療の給付を受けることができる。","エ   「介護保険制度」は、加齢による心身の変化に起因して要介護状態になった要介護者が、尊\n    厳を保って日常生活を営むための、保健・医療・福祉サービスを給付するための、国民の共\n    同連帯の理念に基づき、要介護者を社会全体で支える新たな仕組みとして平成１7 年４月よ\n    り導入された。","オ   「公害健康被害の補償等に関する法律」は、大気汚染、または水質の汚濁の影響による健康\n    被害に対する補償として療養の給付、障害補償費などの給付を行うものであり、厚生労働大\n    臣から公害医療手帳を交付された公害認定患者に対してのみ実施される。"],"correct":5,"correct_text":"5 エ、オ","changed":[["エ","「介護保険制度」は、加齢による心身の変化に起因して要介護状態になった要介護者が、尊 厳を保って日常生活を営むための、保健・医療・福祉サービスを給付するための、国民の共 同連帯の理念に基づき、 らない。","エ   療養担当規則には、保険医療機関が保険診療を行うにあたっての療養担当を定めたものと、\n    保険医が保険診療を行う際の治療方針等を定めたものに大別できる。","オ   投薬量は、予見することができる必要期間に従ったものでなければならないこととし、厚生\n    労働大臣が定める内服薬及び外用薬については当該厚生労働大臣が定める内服薬及び外用薬\n    ごとに１回１４日分、３０日分又は 6０日分を限度とする。"],"correct":4,"correct_text":"4 ウ、オ","changed":[["ア","保険診療を行うためには、病院・診療所が保険医療を行う機関として地方厚生局長から指定 を受け、さらに医師が保険医として登録されていなければならない。これを二重指定制とい う。","保険診療を行うためには、病院・診療所が保険医療を行う機関として厚生労働大臣から指定 を受け、さらに医師が保険医として登録されていなければならない。これを二重指定制とい う。"],["ウ","治験対象の薬物を使用する場合、厚生労働大臣の定める「薬価基準」に収載されている医薬 品以外の薬物を患者に使用してはならない。","治験対象の薬物を使用する場合、厚その他厚生労働大臣が定める場合においてはこの限りで ない。"],["オ","投薬量は、予見することができる必要期間に従ったものでなければならないこととし、厚生 労働大臣が定める内服薬及び外用薬については当該厚生労働大臣が定める内服薬及び外用薬 ごとに１回１４日分、３０日分又は 6０日分を限度とする。","投薬量は、予見することができる必要期間に従ったものでなければならないこととし、厚生 労働大臣が定める内服薬及び外用薬については当該厚生労働大臣が定める内服薬及び外用薬 ごとに１回１４日分、３０日分又は 9０日分を限度とする。"]],"red":["ウ","その他厚生労働大臣が定める場合においてはこの限りで","ない。","オ","9０日分","4 ウ、オ"],"explanation_html":"<div class=\"answerline\"><strong>誤っている項目：</strong>ウ、オ</div><div class=\"diffblock\"><div class=\"difflabel\">ウ</div><div class=\"diffline\">治験対象の薬物を使用する場合、厚<span class=\"ins\">その他厚</span>生労働大臣<del>の</del><span class=\"ins\">が</span>定める<del>「薬価基準」</del><span class=\"ins\">場合</span>に<del>収載されて</del><span class=\"ins\">お</span>い<del>る医薬 品以外の薬物を患者に使用し</del>ては<del>なら</del><span class=\"ins\">この限りで </span>ない。</div><div class=\"correctline\"><strong>正しい文：</strong> 治験対象の薬物を使用する場合、厚その他厚生労働大臣が定める場合においてはこの限りで ない。</div></div><div class=\"diffblock\"><div class=\"difflabel\">オ</div><div class=\"diffline\">投薬量は、予見することができる必要期間に従ったものでなければならないこととし、厚生 労働大臣が定める内服薬及び外用薬については当該厚生労働大臣が定める内服薬及び外用薬 ごとに１回１４日分、３０日分又は <del>6</del><span class=\"ins\">9</span>０日分を限度とする。</div><div class=\"correctline\"><strong>正しい文：</strong> 投薬量は、予見することができる必要期間に従ったものでなければならないこととし、厚生 労働大臣が定める内服薬及び外用薬については当該厚生労働大臣が定める内服薬及び外用薬 ごとに１回１４日分、３０日分又は 9０日分を限度とする。</div></div>","mode":"statements","option_labels":["ア","イ","ウ","エ","オ"],"correct_labels":["ウ","オ"],"required":2},{"id":31,"body":"第 31 問 次の中から誤っている文章を2つ選びなさい。","options":["ア   診療報酬とは、保険医が、  問 患者影響レベルについて正しい文章を2つ選びなさい。","options":["ア    影響レベル 2 までが「ヒヤリ・ハット事例（＝インシデント事例）」、レベル 3a 以上が「医療\n    事故」とする。","イ    レベル２は行った医療又は管理により、患者に影響を与えた、又は何らかの影響を与えた可\n    能性がある場合で、障害の程度及び〔継続性〕は軽度〔一過性〕である。","ウ    レベル３b は行った医療又は管理により、本来必要でなかった治療や処置が必要となった場\n    合で、障害の程度及び〔継続性〕は中・高度〔一過性〕である。","エ    レベル４は行った医療又は管理により、生活に影響する重大な永続的障害が発生した可能性\n    がある場合で、障害の程度及び〔継続性〕は高度〔死亡〕である。","オ    レベル１は誤った行為を患者に実施したが、結果として患者に影響を及ぼすに至らなかった\n    場合で、障害の程度及び〔継続性〕はなしである。"],"correct":4,"correct_text":"4 ウ、オ","changed":[["ア","影響レベル 2 までが「ヒヤリ・ハット事例（＝インシデント事例）」、レベル 3a 以上が「医療 事故」とする。","影響レベル３ａまでが「ヒヤリ・ハット事例（＝インシデント事例）」、レベル３ｂ以上が 「医療事故」とする。"],["イ","レベル２は行った医療又は管理により、患者に影響を与えた、又は何らかの影響を与えた可 能性がある場合で、障害の程度及び〔継続性〕は軽度〔一過性〕である。","レベル２は行った医療又は管理により、患者に影響を与えた、又は何らかの影響を与えた可 能性がある場合で、障害の程度及び〔継続性〕は軽度なしである。"],["エ","レベル４は行った医療又は管理により、生活に影響する重大な永続的障害が発生した可能性 がある場合で、障害の程度及び〔継続性〕は高度〔死亡〕である。","レベル４は行った医療又は管理により、生活に影響する重大な永続的障害が発生した可能性 がある場合で、障害の程度及び〔継続性〕は高度〔永続的〕である。"]],"red":["３ａまで","３ｂ以上","なし","ウ","〔永続的〕","オ","4 ウ、オ"],"explanation_html":"<div class=\"answerline\"><strong>正しい項目：</strong>ウ、オ</div><div class=\"diffblock\"><div class=\"difflabel\">ウ</div><div class=\"correctline\">レベル３b は行った医療又は管理により、本来必要でなかった治療や処置が必要となった場 合で、障害の程度及び〔継続性〕は中・高度〔一過性〕である。</div></div><div class=\"diffblock\"><div class=\"difflabel\">オ</div><div class=\"correctline\">レベル１は誤った行為を患者に実施したが、結果として患者に影響を及ぼすに至らなかった 場合で、障害の程度及び〔継続性〕はなしである。</div></div>","mode":"statements","option_labels":["ア","イ","ウ","エ","オ"],"correct_labels":["ウ","オ"],"required":2},{"id":36,"body":"第 36 問 次の中から誤っている文章を2つ選びなさい。","options":["ア    医薬品安全管理責任者は、院長の指名により選任され、医薬品の安全使用を確保するための\n    業務を行う責任者をいう。","イ    医療安全管理委員会の委員長は、原則として副院長、副委員長は、原則として医療安全管理\n    者及び診療部長とする。","ウ    医療安全管理者は、医療安全に関する十分な知識を有する者とする（医療安全管理者の養成\n    を目的とした研修で、通算して４0 時間以上の研修を終了した者）。","エ    医療安全管理者は、院長の指名により選任され、医療安全推進担当者を指導し、連携・協同\n    の上、特定の部門ではなく病院全般にかかる医療安全対策の立案・実行・評価を含め、医療安\n    全管理のための組織横断的な活動を行う者をいい、副院長をもって充てるものとする。","オ    医療事故調査制度に該当する事案であって、かつ、院内の医療安全管理委員会で、原因等に\n    ついて十分な結論づけができない場合等には、院長は、第三者的立場から検証を行うため、グ\n    ループ担当者及び専門医又は看護師等の外部委員を参画させた拡大医療安全検討委員会を開催\n    する。"],"correct":5,"correct_text":"5 エ、オ","changed":[["エ","医療安全管理者は、院長の指名により選任され、医療安全推進担当者を指導し、連携・協同 の上、特定の部門ではなく病院全般にかかる医療安全対策の立案・実行・評価を含め、医療安 全管理のための組織横断的な活動を行う者をいい、副院長をもって充てるものとする。","医療安全管理者は、院長の指名により選任され、医療安全推進担当者を指導し、連携・協同 の上、特定の部門ではなく病院全般にかかる医療安全対策の立案・実行・評価を含め、医療安 全管理のための組織横断的な活動を行う者をいい、看護師長をもって充てるものとする。"],["オ","医療事故調査制度に該当する事案であって、かつ、院内の医療安全管理委員会で、原因等に ついて十分な結論づけができない場合等には、院長は、第三者的立場から検証を行うため、グ ループ担当者及び専門医又は看護師等の外部委員を参画させた拡大医療安全検討委員会を開催 する。","医療事故調査制度に該当しない事案であって、かつ、院内の医療安全管理委員会で、原因等 について十分な結論づけができない場合等には、院長は、第三者的立場から検証を行うため、 グループ担当者及び専門医又は看護師等の外部委員を参画させた拡大医療安全検討委員会を開 催する。"]],"red":["エ","看護師長","オ","医療事故調査制度に該当しない事案","5 エ、オ"],"explanation_html":"<div class=\"answerline\"><strong>誤っている項目：</strong>エ、オ</div><div class=\"diffblock\"><div class=\"difflabel\">エ</div><div class=\"diffline\">医療安全管理者は、院長の指名により選任され、医療安全推進担当者を指導し、連携・協同 の上、特定の部門ではなく病院全般にかかる医療安全対策の立案・実行・評価を含め、医療安 全管理のための組織横断的な活動を行う者をいい、<del>副院</del><span class=\"ins\">看護師</span>長をもって充てるものとする。</div><div class=\"correctline\"><strong>正しい文：</strong> 医療安全管理者は、院長の指名により選任され、医療安全推進担当者を指導し、連携・協同 の上、特定の部門ではなく病院全般にかかる医療安全対策の立案・実行・評価を含め、医療安 全管理のための組織横断的な活動を行う者をいい、看護師長をもって充てるものとする。</div></div><div class=\"diffblock\"><div class=\"difflabel\">オ</div><div class=\"diffline\">医療事故調査制度に該当<del>する</del><span class=\"ins\">しない</span>事案であって、かつ、院内の医療安全管理委員会で、原因等<span class=\"ins\"> </span>に<del> </del>ついて十分な結論づけができない場合等には、院長は、第三者的立場から検証を行うため、<span class=\"ins\"> </span>グ<del> </del>ループ担当者及び専門医又は看護師等の外部委員を参画させた拡大医療安全検討委員会を開<span class=\"ins\"> </span>催<del> </del>する。</div><div class=\"correctline\"><strong>正しい文：</strong> 医療事故調査制度に該当しない事案であって、かつ、院内の医療安全管理委員会で、原因等 について十分な結論づけができない場合等には、院長は、第三者的立場から検証を行うため、 グループ担当者及び専門医又は看護師等の外部委員を参画させた拡大医療安全検討委員会を開 催する。</div></div>","mode":"statements","option_labels":["ア","イ","ウ","エ","オ"],"correct_labels":["エ","オ"],"required":2},{"id":37,"body":"第 37 問 次の中から誤っている文章を2つ選びなさい。","options":["ア   外来患者数とは、０時から２４時までに新来、再来、往診を問わず、受け付けた患者数であ\n    る。外来の function esc(s){
  return String(s).replace(/[&<>"]/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]||ch;
  });
}

let currentIndex=0;
const state=DATA.map(function(){return {graded:false,correct:null};});

function getCard(index){return document.querySelector('.card[data-index="'+index+'"]');}
function getCurrentCard(){return getCard(currentIndex);}

function clearFeedback(card,form){
  form.querySelectorAll('.opt').forEach(function(x){x.classList.remove('correct','incorrect','sel','correct-answer');});
  card.querySelectorAll('.score,.explain-details').forEach(function(x){x.remove();});
}

function hasAnswer(q,form){
  if(q.mode==='statements') return form.querySelectorAll('input[type="checkbox"]:checked').length>0;
  return !!form.querySelector('input[type="radio"]:checked');
}

function render(){

  app.innerHTML='';
  DATA.forEach(function(q,index){
    const card=document.createElement('section');
    card.className='card';
    card.dataset.qid=q.id;
    card.dataset.index=index;

    const chip=document.createElement('div');
    chip.className='question-chip';
    chip.textContent='問 '+(index+1)+' / '+DATA.length;
    card.appendChild(chip);

    const h=document.createElement('div');
    h.className='title';
    h.textContent=q.body;
    card.appendChild(h);

    const form=document.createElement('div');
    form.className='question-options';

    if(q.mode==='statements'){
      q.options.forEach(function(text,idx){
        const label=document.createElement('label');
        label.className='opt';
        label.dataset.letter=q.option_labels[idx];
        label.dataset.originalIndex=idx;

        const cb=document.createElement('input');
        cb.type='checkbox';
        cb.name='q_'+q.id;
        cb.value=q.option_labels[idx];
        cb.addEventListener('change',function(){
          const checked=[].slice.call(form.querySelectorAll('input[type="checkbox"]:checked'));
          if(checked.length>q.required) cb.checked=false;
          state[index].graded=false;
          state[index].correct=null;
          clearFeedback(card,form);
          updateUI();
        });

        const span=document.createElement('div');
        span.textContent=text;
        label.appendChild(cb);
        label.appendChild(span);
        form.appendChild(label);
      });
    }else{
      q.options.forEach(function(text,idx){
        const label=document.createElement('label');
        label.className='opt';
        label.dataset.original=idx+1;
        label.dataset.originalIndex=idx;

        const r=document.createElement('input');
        r.type='radio';
        r.name='q_'+q.id;
        r.value=idx+1;
        r.addEventListener('change',function(){
          state[index].graded=false;
          state[index].correct=null;
          clearFeedback(card,form);
          updateUI();
        });

        const span=document.createElement('div');
        span.innerHTML='<strong>'+(idx+1)+'.</strong> '+esc(text);
        label.appendChild(r);
        label.appendChild(span);
        form.appendChild(label);
      });
    }
    card.appendChild(form);

    const rr=document.createElement('div');
    rr.className='question-reset-row';
    const reset=document.createElement('button');
    reset.type='button';
    reset.className='question-reset';
    reset.textContent='この問題をリセット';
    reset.addEventListener('click',function(){resetCard(card,form,index);});
    rr.appendChild(reset);
    card.appendChild(rr);

    app.appendChild(card);
  });

  const note=document.createElement('div');
  note.className='footer';
  note.textContent='※ 問題文・正答・解説は、添付された「問題文用」「解答・解説用」資料を基に作成しています。';
  app.appendChild(note);

  buildQuestionGrid();
  showQuestion(0,false);
}

function showMessage(card,text){
  const score=document.createElement('div');
  score.className='score';
  score.textContent=text;
  card.appendChild(score);
}

function addExplanation(card,q,answerHtml){
  const details=document.createElement('details');
  details.className='explain-details';
  details.open=true;
  const summary=document.createElement('summary');
  summary.textContent='解説を開く／閉じる';
  const exp=document.createElement('div');
  exp.className='explain';

  const holder=document.createElement('div');
  holder.innerHTML=q.explanation_html||'';
  const oldAnswer=holder.querySelector('.answerline');
  if(oldAnswer) oldAnswer.remove();

  const answer=document.createElement('div');
  answer.className='answerline';
  answer.innerHTML=answerHtml;
  exp.appendChild(answer);
  while(holder.firstChild) exp.appendChild(holder.firstChild);

  details.appendChild(summary);
  details.appendChild(exp);
  card.appendChild(details);
}

function gradeStatements(q,card,form,index){
  clearFeedback(card,form);
  const checked=[].slice.call(form.querySelectorAll('input[type="checkbox"]:checked'));
  if(checked.length!==q.required){
    showMessage(card,'⚠️ '+q.required+'つ選択してから採点してください。');
    return false;
  }
  const selected=new Set(checked.map(function(x){return x.value;}));
  const target=new Set(q.correct_labels);
  const exact=selected.size===target.size && [].slice.call(target).every(function(x){return selected.has(x);});

  form.querySelectorAll('.opt').forEach(function(opt){
    const letter=opt.dataset.letter;
    const input=opt.querySelector('input');
    if(input.checked) opt.classList.add(target.has(letter)?'correct':'incorrect','sel');
    if(!exact && target.has(letter) && !input.checked) opt.classList.add('correct-answer');
  });

  showMessage(card,exact?'✅ 正解！':'❌ 不正解');
  addExplanation(card,q,'<strong>正解：</strong> '+q.correct_labels.join('、'));
  state[index].graded=true;
  state[index].correct=exact;
  updateUI();
  return true;
}

function gradeSingle(q,card,form,index){
  clearFeedback(card,form);
  const selected=form.querySelector('input[type="radio"]:checked');
  if(!selected){
    showMessage(card,'⚠️ 選択肢を1つ選んでから採点してください。');
    return false;
  }
  const val=Number(selected.value);
  const exact=val===q.correct;
  const selectedLabel=selected.closest('.opt');
  selectedLabel.classList.add(exact?'correct':'incorrect','sel');

  const correctLabel=form.querySelector('.opt[data-original="'+q.correct+'"]');
  if(correctLabel && !exact) correctLabel.classList.add('correct-answer');

  showMessage(card,exact?'✅ 正解！':'❌ 不正解');
  addExplanation(card,q,'<strong>正解：</strong> '+esc(q.options[q.correct-1]||''));
  state[index].graded=true;
  state[index].correct=exact;
  updateUI();
  return true;
}

function gradeCurrent(){
  const q=DATA[currentIndex];
  const card=getCurrentCard();
  if(!card) return;
  const form=card.querySelector('.question-options');
  const done=q.mode==='statements'
    ? gradeStatements(q,card,form,currentIndex)
    : gradeSingle(q,card,form,currentIndex);
  if(done){
    setTimeout(function(){
      const result=card.querySelector('.score');
      if(result) result.scrollIntoView({behavior:'smooth',block:'center'});
    },40);
  }
}

function shuffledCopy(items){
  const a=items.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function statementTextWithoutPrefix(q,idx){
  const original=q.options[idx]||'';
  const letter=(q.option_labels&&q.option_labels[idx])||'';
  if(letter && original.startsWith(letter)) return original.slice(letter.length).replace(/^\s+/,'');
  return original.replace(/^[ア-ン]\s+/,'');
}

function setQuestionShuffle(q,card,enabled){
  const form=card.querySelector('.question-options');
  if(!form) return;
  let items=[].slice.call(form.querySelectorAll('.opt'));
  if(enabled) items=shuffledCopy(items);
  else items.sort(function(a,b){return Number(a.dataset.originalIndex)-Number(b.dataset.originalIndex);});
  items.forEach(function(item){form.appendChild(item);});

  form.querySelectorAll('.opt').forEach(function(opt){
    const idx=Number(opt.dataset.originalIndex);
    const span=opt.querySelector('div');
    if(q.mode==='statements'){
      span.textContent=enabled?statementTextWithoutPrefix(q,idx):(q.options[idx]||'');
    }else{
      span.innerHTML=enabled?esc(q.options[idx]||''):'<strong>'+(idx+1)+'.</strong> '+esc(q.options[idx]||'');
    }
  });
  form.dataset.shuffled=enabled?'true':'false';
}

function setGlobalShuffle(enabled){
  DATA.forEach(function(q,index){
    const card=getCard(index);
    if(card) setQuestionShuffle(q,card,enabled);
  });
}

function resetCard(card,form,index){
  form.querySelectorAll('input').forEach(function(x){x.checked=false;});
  clearFeedback(card,form);
  state[index].graded=false;
  state[index].correct=null;
  updateUI();
}

function resetAll(){
  DATA.forEach(function(q,index){
    const card=getCard(index);
    if(!card) return;
    resetCard(card,card.querySelector('.question-options'),index);
  });
  showQuestion(0,true);
}

function getAnsweredCount(){
  let count=0;
  DATA.forEach(function(q,index){
    const card=getCard(index);
    if(card && hasAnswer(q,card.querySelector('.question-options'))) count++;
  });
  return count;
}

function showQuestion(index,scrollTop){
  if(index<0 || index>=DATA.length) return;
  currentIndex=index;
  document.querySelectorAll('.card').forEach(function(c){c.classList.remove('active');});
  const card=getCurrentCard();
  if(card) card.classList.add('active');
  if(scrollTop!==false) window.scrollTo({top:0,behavior:'smooth'});
  updateUI();
}

function updateUI(){
  const pct=((currentIndex+1)/DATA.length)*100;
  document.getElementById('progressText').textContent='問 '+(currentIndex+1)+' / '+DATA.length;
  document.getElementById('answeredText').textContent='回答 '+getAnsweredCount()+' / '+DATA.length;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('prevBtn').disabled=currentIndex===0;
  document.getElementById('nextBtn').disabled=currentIndex===DATA.length-1;

  const grid=document.getElementById('questionGrid');
  if(grid){
    [].slice.call(grid.querySelectorAll('.qjump')).forEach(function(btn,index){
      btn.classList.remove('answered','correct','wrong','current');
      if(index===currentIndex) btn.classList.add('current');
      const card=getCard(index);
      if(state[index].graded){
        btn.classList.add(state[index].correct?'correct':'wrong');
      }else if(card && hasAnswer(DATA[index],card.querySelector('.question-options'))){
        btn.classList.add('answered');
      }
    });
  }
}

function buildQuestionGrid(){
  const grid=document.getElementById('questionGrid');
  grid.innerHTML='';
  DATA.forEach(function(q,index){
    const b=document.createElement('button');
    b.type='button';
    b.className='qjump';
    b.textContent=index+1;
    b.addEventListener('click',function(){
      closeQuestionList();
      showQuestion(index,true);
    });
    grid.appendChild(b);
  });
}

function openQuestionList(){
  const overlay=document.getElementById('questionOverlay');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  updateUI();
}

function closeQuestionList(){
  const overlay=document.getElementById('questionOverlay');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

render();

document.getElementById('prevBtn').addEventListener('click',function(){showQuestion(currentIndex-1,true);});
document.getElementById('nextBtn').addEventListener('click',function(){showQuestion(currentIndex+1,true);});
document.getElementById('gradeBtn').addEventListener('click',gradeCurrent);
document.getElementById('questionListBtn').addEventListener('click',openQuestionList);
document.getElementById('closeQuestionListBtn').addEventListener('click',closeQuestionList);
document.getElementById('questionOverlay').addEventListener('click',function(e){if(e.target===this) closeQuestionList();});
document.getElementById('globalShuffle').addEventListener('change',function(){setGlobalShuffle(this.checked);});
document.getElementById('resetAllBtn').addEventListener('click',function(){
  if(confirm('全50問の回答をリセットしますか？')) resetAll();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeQuestionList();
});

</script>
</body>
</html>
